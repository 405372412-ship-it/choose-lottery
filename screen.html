<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIP礼品直播抽奖大屏</title>
  <style>
    :root {
      --cyan: #29e7ff;
      --cyan-2: #82f7ff;
      --magenta: #f145ff;
      --red: #ff2b5e;
      --gold: #ffd36a;
      --gold-2: #b97820;
      --gold-3: #fff4c7;
      --ink: #f2fdff;
      --muted: #acd0de;
      --line: rgba(41,231,255,.26);
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(3, 12, 22, .08), rgba(2, 8, 16, .58)),
        url("assets/vault-stage-bg-ai.png") center / cover no-repeat fixed,
        #06121d;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 16%, rgba(41,231,255,.24), transparent 18%),
        radial-gradient(circle at 50% 64%, rgba(255,211,106,.18), transparent 24%),
        linear-gradient(90deg, rgba(0,0,0,.58), transparent 34%, transparent 66%, rgba(0,0,0,.58));
    }

    .screen {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
      padding: 24px min(4vw, 54px) 22px;
    }

    .screen > header,
    .screen > .stage,
    .screen > .bottom {
      position: relative;
      z-index: 1;
    }

    .beam-layer {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .beam {
      position: absolute;
      top: -18vh;
      height: 142vh;
      width: clamp(34px, 4.8vw, 78px);
      border-radius: 0;
      opacity: .68;
      mix-blend-mode: screen;
      transform-origin: top center;
      clip-path: polygon(44% 0, 56% 0, 100% 100%, 0 100%);
      animation: beamSweep 3.25s ease-in-out infinite;
    }

    .beam::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      filter: blur(8px);
      opacity: .78;
      background: inherit;
    }

    .beam.magenta { background: linear-gradient(90deg, transparent, rgba(241,69,255,.95), transparent); box-shadow: 0 0 34px rgba(241,69,255,.82); }
    .beam.red { background: linear-gradient(90deg, transparent, rgba(255,43,94,.9), transparent); box-shadow: 0 0 32px rgba(255,43,94,.72); }
    .beam.cyan { background: linear-gradient(90deg, transparent, rgba(41,231,255,.76), transparent); box-shadow: 0 0 32px rgba(41,231,255,.62); }
    .beam.gold { background: linear-gradient(90deg, transparent, rgba(255,211,106,.72), transparent); box-shadow: 0 0 30px rgba(255,211,106,.55); }
    .beam.b1 { left: 5%; transform: rotate(31deg); animation-delay: -.8s; }
    .beam.b2 { left: 18%; transform: rotate(20deg); animation-delay: -2.2s; }
    .beam.b3 { left: 38%; transform: rotate(-14deg); animation-delay: -1.4s; }
    .beam.b4 { right: 34%; transform: rotate(15deg); animation-delay: -3.1s; }
    .beam.b5 { right: 17%; transform: rotate(-22deg); animation-delay: -1.8s; }
    .beam.b6 { right: 5%; transform: rotate(-33deg); animation-delay: -2.8s; }

    .sparkle-layer {
      position: absolute;
      top: 2vh;
      left: 50%;
      width: min(620px, 48vw);
      height: 25vh;
      transform: translateX(-50%);
      z-index: 0;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      width: var(--s, 14px);
      height: var(--s, 14px);
      left: var(--x);
      top: var(--y);
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(130,247,255,.88));
      animation: diamondSparkle var(--d, 2.4s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .sparkle::before,
    .sparkle::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 44%, rgba(255,255,255,.95) 45% 55%, transparent 56%),
        linear-gradient(0deg, transparent 44%, rgba(130,247,255,.95) 45% 55%, transparent 56%);
      clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
    }

    .sparkle::after {
      transform: rotate(45deg) scale(.62);
      background:
        linear-gradient(90deg, transparent 43%, rgba(255,244,199,.9) 45% 55%, transparent 57%),
        linear-gradient(0deg, transparent 43%, rgba(255,244,199,.9) 45% 55%, transparent 57%);
    }

    header {
      display: grid;
      grid-template-columns: minmax(160px, 1fr) minmax(320px, auto) minmax(160px, 1fr);
      align-items: start;
      gap: 18px;
    }

    h1, h2, p { margin: 0; }
    .title {
      grid-column: 2;
      justify-self: center;
      text-align: center;
      max-width: 1000px;
    }

    .kicker {
      margin-bottom: 6px;
      color: var(--cyan-2);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 0 16px rgba(41,231,255,.55);
    }

    h1 {
      font-size: clamp(34px, 4.4vw, 68px);
      line-height: 1.08;
      font-weight: 900;
      color: transparent;
      background: linear-gradient(90deg, #ffffff, var(--cyan-2), #fff6cf, var(--gold), #ffffff);
      background-size: 260% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: 0 0 42px rgba(41,231,255,.32);
      animation: titleFlow 4s linear infinite;
    }

    .status {
      justify-self: end;
      min-width: 172px;
      min-height: 54px;
      border: 1px solid rgba(255,211,106,.5);
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: #171006;
      background: linear-gradient(180deg, #fff4c7, #d6992d);
      box-shadow: 0 0 34px rgba(255,211,106,.28);
      font-size: 15px;
      font-weight: 900;
    }

    .audio-btn {
      justify-self: start;
      width: 54px;
      height: 54px;
      border: 1px solid rgba(41,231,255,.42);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(4, 17, 29, .66);
      box-shadow: 0 0 26px rgba(41,231,255,.2);
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
    }

    .stage {
      position: relative;
      display: grid;
      align-items: center;
      min-height: 0;
      padding-top: 10px;
    }

    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 8px;
      border-radius: 999px;
      pointer-events: none;
      filter: blur(.2px);
      opacity: .76;
      transform-origin: top center;
    }

    .stage::before {
      left: 13%;
      background: linear-gradient(180deg, transparent, var(--magenta), transparent);
      box-shadow: 0 0 24px var(--magenta);
      animation: laserLeft 4.8s ease-in-out infinite;
    }

    .stage::after {
      right: 14%;
      background: linear-gradient(180deg, transparent, var(--red), transparent);
      box-shadow: 0 0 22px var(--red);
      animation: laserRight 4.3s ease-in-out infinite;
    }

    .vaults {
      --cols: 3;
      width: min(1240px, 100%);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      gap: clamp(14px, 2vw, 24px);
      align-items: center;
      perspective: 1400px;
    }

    .vaults.count-7,
    .vaults.count-8 { --cols: 4; }

    .vaults.count-4 {
      --cols: 4;
      max-width: 1420px;
    }

    .vault {
      position: relative;
      --door-w: min(100%, 310px);
      height: clamp(236px, 29vh, 330px);
      min-width: 0;
      border: 0;
      border-radius: 8px;
      background: transparent;
      display: grid;
      place-items: center;
      cursor: pointer;
      overflow: visible;
      transform-style: preserve-3d;
      filter: drop-shadow(0 24px 28px rgba(0,0,0,.42));
      transition: transform .28s ease, filter .28s ease;
    }

    .vault:hover:not(.disabled) {
      z-index: 5;
      transform: scale(1.08);
      filter: drop-shadow(0 28px 34px rgba(0,0,0,.46)) drop-shadow(0 0 24px rgba(255,211,106,.34));
    }

    .vault-shell,
    .vault-spoke,
    .vault-bolts {
      display: none;
    }

    .vault-shell {
      position: absolute;
      left: 9%;
      right: 9%;
      top: 19%;
      bottom: 12%;
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(91,50,8,.48), transparent 12%, transparent 88%, rgba(91,50,8,.58)),
        linear-gradient(180deg, #ffe27a 0%, #d18b1d 42%, #7a3c09 100%);
      box-shadow:
        inset 0 3px 0 rgba(255,255,255,.42),
        inset 0 -8px 14px rgba(67,27,0,.38),
        0 0 0 2px rgba(92,47,5,.52);
    }

    .vault-shell::before,
    .vault-shell::after {
      content: "";
      position: absolute;
      left: -5%;
      width: 11%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8b4708, #ffd96a 36%, #b96812 72%, #6a2e04);
      box-shadow: inset 3px 0 4px rgba(255,255,255,.34), inset -5px 0 6px rgba(64,27,0,.42);
    }

    .vault-shell::before { top: 0; bottom: 52%; }
    .vault-shell::after { top: 54%; bottom: 0; }

    .vault-door {
      position: absolute;
      width: var(--door-w);
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transform-origin: 83% 50%;
      transition: transform .78s cubic-bezier(.2,.8,.2,1), filter .55s ease, opacity .55s ease;
      background: url("assets/vault-door-round-ai.png") center / contain no-repeat;
      box-shadow:
        0 0 34px rgba(86, 184, 220, .12),
        0 0 26px rgba(218,190,126,.18),
        0 24px 34px rgba(0,0,0,.38);
      z-index: 2;
      overflow: hidden;
      animation: none;
      filter: brightness(1.18) saturate(1.34) sepia(.16) hue-rotate(-5deg);
    }

    .vault-door::before {
      content: none;
    }

    .vault-door::after {
      content: "";
      position: absolute;
      inset: 8% 12%;
      border-radius: 999px;
      box-shadow: inset 0 0 38px rgba(255,244,199,.12), 0 0 24px rgba(255,211,106,.08);
      pointer-events: none;
    }

    .vault-spoke {
      position: absolute;
      z-index: 4;
      width: 42%;
      height: 9%;
      left: 29%;
      top: 45.5%;
      border-radius: 999px;
      background: linear-gradient(180deg, #fff0a5, #c47615 58%, #6d3104);
      box-shadow: inset 0 2px 3px rgba(255,255,255,.34), inset 0 -4px 5px rgba(64,27,0,.42);
      transform-origin: 50% 50%;
      transition: transform .78s cubic-bezier(.2,.8,.2,1), opacity .55s ease;
      pointer-events: none;
    }

    .vault-spoke.s2 { transform: rotate(60deg); }
    .vault-spoke.s3 { transform: rotate(120deg); }

    .vault-bolts {
      position: absolute;
      inset: 5%;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 6%, #6b3104 0 2.2%, transparent 2.5%),
        radial-gradient(circle at 83% 25%, #6b3104 0 2.2%, transparent 2.5%),
        radial-gradient(circle at 83% 75%, #6b3104 0 2.2%, transparent 2.5%),
        radial-gradient(circle at 50% 94%, #6b3104 0 2.2%, transparent 2.5%),
        radial-gradient(circle at 17% 75%, #6b3104 0 2.2%, transparent 2.5%),
        radial-gradient(circle at 17% 25%, #6b3104 0 2.2%, transparent 2.5%);
      opacity: .9;
      pointer-events: none;
    }

    .vault:hover {
      filter: drop-shadow(0 26px 30px rgba(0,0,0,.44)) drop-shadow(0 0 22px rgba(255,211,106,.22));
    }

    .vault-interior {
      position: absolute;
      width: var(--door-w);
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      z-index: 1;
      transform: translate(-50%, -50%) scale(.96);
      opacity: 0;
      background: url("assets/vault-interior-ai.png") center / contain no-repeat;
      filter: drop-shadow(0 20px 30px rgba(0,0,0,.34)) drop-shadow(0 0 24px rgba(255,211,106,.22));
      transition: opacity .45s ease .12s, transform .55s ease .12s;
      pointer-events: none;
    }

    .vault.opened .vault-interior {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.96);
    }

    .vault.opened .vault-door {
      transform: translate(-50%, -50%);
      opacity: 1;
      filter: brightness(.9) saturate(.98) sepia(.12) hue-rotate(-4deg);
    }

    .vault.opened .vault-spoke {
      opacity: .18;
    }

    .vault.disabled {
      cursor: not-allowed;
      filter: grayscale(.55) brightness(.72);
    }

    .vault-no {
      position: absolute;
      z-index: 7;
      width: clamp(58px, 5.5vw, 76px);
      height: clamp(58px, 5.5vw, 76px);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #391904;
      background:
        radial-gradient(circle at 34% 28%, #fff6d6 0 13%, transparent 14%),
        radial-gradient(circle, #f1d99a 0 35%, #c79d46 36% 62%, #6a4316 63% 100%);
      border: 3px solid rgba(238,218,168,.82);
      box-shadow:
        inset 0 5px 8px rgba(255,255,255,.38),
        inset 0 -9px 14px rgba(91,38,0,.48),
        0 0 0 3px rgba(122,55,4,.56),
        0 0 24px rgba(218,190,126,.34);
      text-shadow: 0 2px 0 rgba(245,229,187,.68);
      font-size: clamp(30px, 3.3vw, 46px);
      font-weight: 900;
      transition: transform .55s ease, opacity .55s ease;
      animation: numberPulse 1.45s ease-in-out infinite;
    }

    .vault.opened .vault-no {
      transform: scale(.78);
      opacity: .28;
      animation: none;
    }

    .door-star {
      position: absolute;
      z-index: 8;
      left: var(--x);
      top: var(--y);
      width: var(--s, 22px);
      height: var(--s, 22px);
      pointer-events: none;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(255,244,199,.9));
      animation: doorStarFlash var(--d, 2.2s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .door-star::before,
    .door-star::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 46%, rgba(255,255,255,.98) 48% 52%, transparent 54%),
        linear-gradient(0deg, transparent 46%, rgba(255,244,199,.96) 48% 52%, transparent 54%);
      clip-path: polygon(50% 0, 56% 43%, 100% 50%, 56% 57%, 50% 100%, 44% 57%, 0 50%, 44% 43%);
    }

    .door-star::after {
      transform: rotate(45deg) scale(.62);
      opacity: .75;
    }

    .drawn-mask {
      position: absolute;
      z-index: 9;
      width: var(--door-w);
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle, rgba(218,190,126,.2), rgba(5,12,20,.56) 48%, rgba(0,0,0,.72)),
        linear-gradient(180deg, rgba(0,0,0,.28), rgba(0,0,0,.64));
      border: 1px solid rgba(218,190,126,.46);
      box-shadow: inset 0 0 38px rgba(0,0,0,.42), 0 0 20px rgba(218,190,126,.16);
      color: #f3dfae;
      font-size: clamp(20px, 2.4vw, 32px);
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(0,0,0,.8), 0 0 18px rgba(255,211,106,.65);
    }

    .vault.opened .drawn-mask {
      display: grid;
    }

    .prize-peek {
      position: absolute;
      left: 50%;
      top: 52%;
      width: min(52%, 168px);
      height: min(44%, 135px);
      z-index: 4;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.7);
      transition: opacity .55s ease .3s, transform .55s ease .3s;
      border-radius: 8px;
      background: radial-gradient(circle, rgba(255,233,145,.38), rgba(255,211,106,.18) 42%, transparent 72%);
    }

    .vault.opened .prize-peek { opacity: 0; transform: translate(-50%, -50%) scale(.7); }
    .prize-peek img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 18px 22px rgba(0,0,0,.36)); }

    .bottom {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      min-height: 68px;
    }

    .message {
      min-width: min(760px, 100%);
      border: 1px solid rgba(41,231,255,.28);
      border-radius: 8px;
      padding: 12px 18px;
      background: rgba(3, 15, 27, .64);
      box-shadow: inset 0 0 24px rgba(41,231,255,.06);
      color: #dffaff;
      text-align: center;
      font-size: clamp(16px, 1.7vw, 24px);
      font-weight: 800;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(0, 5, 12, .68);
      backdrop-filter: blur(10px);
    }

    .modal.show { display: grid; }

    .result {
      position: relative;
      width: min(620px, 100%);
      border: 1px solid rgba(255,211,106,.52);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
      background:
        radial-gradient(circle at 50% 0, rgba(255,211,106,.35), transparent 28%),
        linear-gradient(180deg, rgba(13, 37, 56, .98), rgba(5, 14, 25, .96));
      box-shadow: 0 38px 120px rgba(0,0,0,.55), 0 0 60px rgba(255,211,106,.22);
      overflow: hidden;
    }

    .result::before {
      content: "";
      position: absolute;
      top: -35%;
      left: 48%;
      width: 18px;
      height: 130%;
      background: linear-gradient(180deg, transparent, rgba(255,244,199,.82), transparent);
      filter: blur(10px);
      transform: rotate(18deg);
      animation: spotlight 1.2s ease-in-out infinite alternate;
    }

    .result h2 {
      position: relative;
      font-size: clamp(28px, 4vw, 46px);
      color: var(--gold);
      text-shadow: 0 0 26px rgba(255,211,106,.48);
    }

    .result img {
      position: relative;
      width: min(260px, 70vw);
      height: 210px;
      object-fit: contain;
      margin: 18px auto 8px;
      filter: drop-shadow(0 22px 26px rgba(0,0,0,.44));
    }

    .result-name {
      position: relative;
      font-size: clamp(24px, 3vw, 36px);
      font-weight: 900;
      color: #fff8dc;
    }

    .close-btn {
      position: relative;
      min-height: 46px;
      min-width: 138px;
      margin-top: 20px;
      border: 1px solid rgba(255,211,106,.55);
      border-radius: 8px;
      color: #171006;
      background: linear-gradient(180deg, #fff4c7, #d6992d);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    .bar {
      position: fixed;
      z-index: 11;
      width: var(--w, 12px);
      height: var(--h, 24px);
      border-radius: 999px;
      background: var(--c, #ffd36a);
      box-shadow: 0 0 16px color-mix(in srgb, var(--c, #ffd36a), white 30%);
      pointer-events: none;
      animation: confettiFly var(--dur, 1.7s) ease-out forwards;
    }

    .bar.star {
      width: var(--w, 18px);
      height: var(--w, 18px);
      clip-path: polygon(50% 0, 61% 36%, 100% 50%, 61% 64%, 50% 100%, 39% 64%, 0 50%, 39% 36%);
    }

    @keyframes titleFlow { to { background-position: 260% 0; } }
    @keyframes laserLeft { 0%,100% { transform: rotate(23deg); } 50% { transform: rotate(37deg); } }
    @keyframes laserRight { 0%,100% { transform: rotate(-24deg); } 50% { transform: rotate(-38deg); } }
    @keyframes beamSweep {
      0%, 100% { translate: -34px 0; opacity: .48; }
      50% { translate: 54px 0; opacity: .92; }
    }
    @keyframes numberPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.16); }
    }
    @keyframes doorStarFlash {
      0%, 100% { opacity: 0; transform: scale(.28) rotate(0deg); }
      18% { opacity: 1; transform: scale(1.18) rotate(18deg); }
      34% { opacity: .2; transform: scale(.58) rotate(36deg); }
      52% { opacity: .9; transform: scale(.92) rotate(54deg); }
      72% { opacity: 0; transform: scale(.35) rotate(80deg); }
    }
    @keyframes diamondSparkle {
      0%, 100% { opacity: 0; transform: scale(.35) rotate(0deg); }
      18% { opacity: .95; transform: scale(1.18) rotate(18deg); }
      36% { opacity: .25; transform: scale(.7) rotate(36deg); }
      52% { opacity: .85; transform: scale(1) rotate(54deg); }
      72% { opacity: 0; transform: scale(.38) rotate(80deg); }
    }
    @keyframes spotlight { from { opacity: .4; transform: rotate(12deg) translateX(-80px); } to { opacity: .95; transform: rotate(24deg) translateX(80px); } }
    @keyframes confettiFly {
      from { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.5); }
      14% { opacity: 1; }
      to { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(1); }
    }

    @media (max-width: 900px) {
      body { overflow: auto; }
      .screen { min-height: 100vh; }
      header { grid-template-columns: 1fr; justify-items: center; }
      .title { grid-column: auto; }
      .status, .audio-btn { justify-self: center; }
      .vaults, .vaults.count-4, .vaults.count-7, .vaults.count-8 { --cols: 2; }
      .vault { --door-w: min(100%, 260px); height: 220px; }
    }
  </style>
</head>
<body>
  <audio id="bgm" src="assets/vip-lottery-bgm.mp3" loop></audio>
  <main class="screen">
    <div class="beam-layer" aria-hidden="true">
      <span class="beam magenta b1"></span>
      <span class="beam cyan b2"></span>
      <span class="beam gold b3"></span>
      <span class="beam cyan b4"></span>
      <span class="beam red b5"></span>
      <span class="beam magenta b6"></span>
    </div>
    <div class="sparkle-layer" aria-hidden="true">
      <span class="sparkle" style="--x: 18%; --y: 34%; --s: 16px; --d: 2.6s; --delay: -.2s"></span>
      <span class="sparkle" style="--x: 28%; --y: 18%; --s: 10px; --d: 2.2s; --delay: -1.1s"></span>
      <span class="sparkle" style="--x: 36%; --y: 48%; --s: 13px; --d: 2.9s; --delay: -.7s"></span>
      <span class="sparkle" style="--x: 46%; --y: 25%; --s: 18px; --d: 2.4s; --delay: -1.7s"></span>
      <span class="sparkle" style="--x: 55%; --y: 44%; --s: 12px; --d: 2.7s; --delay: -.5s"></span>
      <span class="sparkle" style="--x: 64%; --y: 20%; --s: 15px; --d: 2.5s; --delay: -1.3s"></span>
      <span class="sparkle" style="--x: 73%; --y: 36%; --s: 11px; --d: 2.8s; --delay: -.9s"></span>
      <span class="sparkle" style="--x: 82%; --y: 23%; --s: 14px; --d: 2.3s; --delay: -1.8s"></span>
    </div>
    <header>
      <button class="audio-btn" id="audioBtn" title="音乐开关">♪</button>
      <div class="title">
        <p class="kicker">TECH VAULT GIFT DRAW</p>
        <h1 id="activityName">VIP礼品直播抽奖</h1>
      </div>
      <div class="status" id="status">等待抽奖</div>
    </header>

    <section class="stage">
      <div class="vaults" id="vaults"></div>
    </section>

    <footer class="bottom">
      <div class="message" id="message">请选择一个金库编号，开启你的专属礼遇</div>
    </footer>
  </main>

  <div class="modal" id="modal">
    <div class="result">
      <h2>恭喜获得</h2>
      <img id="resultImage" alt="">
      <p class="result-name" id="resultName"></p>
      <button class="close-btn" id="closeModal">继续抽奖</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "vipTechVaultLottery.v1";
    const channel = "BroadcastChannel" in window ? new BroadcastChannel("vip-tech-vault-lottery") : null;
    const defaultImages = [
      "assets/vip-prize-watch.png",
      "assets/vip-prize-phone.png",
      "assets/vip-prize-jd-card.png",
      "assets/vip-prize-computer.png"
    ];
    const defaults = {
      activityName: "VIP礼品直播抽奖",
      vaultCount: 6,
      activeRoundId: "r1",
      gifts: [
        { id: "g1", name: "智能腕表", image: defaultImages[0], enabled: true },
        { id: "g2", name: "旗舰手机", image: defaultImages[1], enabled: true },
        { id: "g3", name: "京东购物卡", image: defaultImages[2], enabled: true },
        { id: "g4", name: "商务电脑", image: defaultImages[3], enabled: true },
        { id: "g5", name: "VIP专属礼盒", image: defaultImages[0], enabled: true },
        { id: "g6", name: "黄金幸运奖", image: defaultImages[2], enabled: true }
      ],
      rounds: [
        { id: "r1", name: "第一轮", winnerCount: 1, drawMode: "random", fixedPrizeId: "g1", records: [] }
      ],
      updatedAt: Date.now()
    };

    let state = loadState();
    let pendingReveal = null;

    const $ = (id) => document.getElementById(id);
    const els = {
      activityName: $("activityName"),
      vaults: $("vaults"),
      status: $("status"),
      message: $("message"),
      modal: $("modal"),
      resultImage: $("resultImage"),
      resultName: $("resultName"),
      bgm: $("bgm"),
      audioBtn: $("audioBtn")
    };

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function loadState() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (stored && Array.isArray(stored.gifts) && Array.isArray(stored.rounds)) return { ...clone(defaults), ...stored };
      } catch (error) {}
      return clone(defaults);
    }
    function saveState() {
      state.updatedAt = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (channel) channel.postMessage({ type: "state", updatedAt: state.updatedAt });
    }
    function activeRound() {
      return state.rounds.find((round) => round.id === state.activeRoundId) || state.rounds[0];
    }
    function normalizeRounds() {
      state.rounds.forEach((round) => {
        round.winnerCount = 1;
        round.records ||= [];
      });
    }
    function allRecords() {
      return state.rounds.flatMap((round) => (round.records || []).map((record) => ({ ...record, roundId: round.id })));
    }
    function nextPendingRound() {
      return state.rounds.find((round) => (round.records || []).length < 1) || null;
    }
    function activeGifts() {
      return state.gifts.filter((gift) => gift.enabled && gift.name.trim());
    }
    function prizeTextForRound(round) {
      if (!round) return "本轮奖品：等待后台配置";
      let gifts = activeGifts();
      if (round.drawMode === "fixed") {
        const fixed = state.gifts.find((gift) => gift.id === round.fixedPrizeId);
        gifts = fixed ? [fixed] : [];
      }
      const names = gifts.map((gift) => gift.name.trim()).filter(Boolean);
      return names.length ? `本轮奖品：${names.join("、")}` : "本轮奖品：等待后台配置";
    }
    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, "&#96;"); }

    function render() {
      normalizeRounds();
      const pendingRound = nextPendingRound();
      const configuredCount = Number(state.vaultCount || 6);
      const count = [4, 6, 8].includes(configuredCount) ? configuredCount : 6;
      const records = allRecords();
      const complete = !pendingRound;
      const completedCount = records.length;
      const totalCount = state.rounds.length;
      els.activityName.textContent = state.activityName || "VIP礼品直播抽奖";
      els.status.textContent = complete ? "全部完成" : `第${state.rounds.indexOf(pendingRound) + 1}轮 ${completedCount}/${totalCount}`;
      els.message.textContent = complete ? "全部轮次已完成，请等待后台新增或重置轮次" : prizeTextForRound(pendingRound);
      els.vaults.className = `vaults count-${count}`;
      const recordMap = new Map(records.map((record) => [Number(record.vaultNo), record]));
      els.vaults.innerHTML = Array.from({ length: count }, (_, index) => {
        const no = index + 1;
        const record = recordMap.get(no);
        const disabled = complete || Boolean(record);
        return `<button class="vault ${record ? "opened" : ""} ${disabled ? "disabled" : ""}" data-vault="${no}" ${disabled ? "disabled" : ""}>
          <span class="vault-shell"></span>
          <span class="vault-interior"></span>
          <span class="vault-door">
            <span class="vault-bolts"></span>
          </span>
          <span class="vault-spoke s1"></span>
          <span class="vault-spoke s2"></span>
          <span class="vault-spoke s3"></span>
          <span class="door-star" style="--x: 28%; --y: 22%; --s: 22px; --d: 2.4s; --delay: ${-(index * .23).toFixed(2)}s"></span>
          <span class="door-star" style="--x: 64%; --y: 26%; --s: 18px; --d: 2.1s; --delay: ${-(index * .31 + .8).toFixed(2)}s"></span>
          <span class="door-star" style="--x: 76%; --y: 58%; --s: 14px; --d: 2.7s; --delay: ${-(index * .19 + 1.2).toFixed(2)}s"></span>
          <span class="vault-no">${no}</span>
          <span class="drawn-mask">已抽奖</span>
          <span class="prize-peek">${record ? `<img src="${escapeAttr(record.image)}" alt="${escapeAttr(record.prizeName)}">` : ""}</span>
        </button>`;
      }).join("");
    }

    function drawPrize(vaultNo) {
      normalizeRounds();
      const round = nextPendingRound();
      if (!round) return null;
      round.records ||= [];
      if (allRecords().some((record) => Number(record.vaultNo) === Number(vaultNo))) return null;
      if (round.records.length >= 1) return null;
      const pool = activeGifts();
      if (!pool.length) {
        alert("后台还没有启用礼品。");
        return null;
      }
      let gift = pool[Math.floor(Math.random() * pool.length)];
      if (round.drawMode === "fixed") {
        gift = state.gifts.find((item) => item.id === round.fixedPrizeId) || gift;
      }
      const record = {
        id: `w${Date.now()}${Math.random().toString(16).slice(2)}`,
        vaultNo,
        prizeId: gift.id,
        prizeName: gift.name,
        image: gift.image,
        time: Date.now()
      };
      round.records.push(record);
      const nextRound = nextPendingRound();
      state.activeRoundId = nextRound ? nextRound.id : round.id;
      return record;
    }

    function showResult(record) {
      pendingReveal = record;
      els.resultName.textContent = record.prizeName;
      els.resultImage.src = record.image;
      els.resultImage.alt = record.prizeName;
      els.modal.classList.add("show");
      burstConfetti();
    }

    function finishReveal() {
      if (pendingReveal) {
        saveState();
        render();
        pendingReveal = null;
      }
      els.modal.classList.remove("show");
    }

    function burstConfetti() {
      const amount = 96;
      const colors = ["#ffd36a", "#ff4f81", "#48e6ff", "#9cff6a", "#b26cff", "#ffffff", "#ff8a3d"];
      for (let i = 0; i < amount; i += 1) {
        const bar = document.createElement("span");
        bar.className = `bar ${Math.random() > .72 ? "star" : ""}`;
        const angle = Math.random() * Math.PI * 2;
        const distance = 180 + Math.random() * 420;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance + 90;
        const color = colors[Math.floor(Math.random() * colors.length)];
        bar.style.left = `${48 + (Math.random() - .5) * 18}vw`;
        bar.style.top = `${36 + (Math.random() - .5) * 18}vh`;
        bar.style.setProperty("--c", color);
        bar.style.setProperty("--dx", `${dx}px`);
        bar.style.setProperty("--dy", `${dy}px`);
        bar.style.setProperty("--rot", `${360 + Math.random() * 720}deg`);
        bar.style.setProperty("--dur", `${1.35 + Math.random() * .9}s`);
        bar.style.setProperty("--w", `${8 + Math.random() * 18}px`);
        bar.style.setProperty("--h", `${14 + Math.random() * 24}px`);
        bar.style.animationDelay = `${Math.random() * .18}s`;
        document.body.appendChild(bar);
        setTimeout(() => bar.remove(), 2600);
      }
    }

    els.vaults.addEventListener("click", (event) => {
      const button = event.target.closest("[data-vault]");
      if (!button || button.disabled) return;
      const vaultNo = Number(button.dataset.vault);
      const record = drawPrize(vaultNo);
      if (record) {
        showResult(record);
      }
    });

    $("closeModal").addEventListener("click", finishReveal);
    els.modal.addEventListener("click", (event) => {
      if (event.target === els.modal) finishReveal();
    });

    els.audioBtn.addEventListener("click", async () => {
      try {
        if (els.bgm.paused) {
          await els.bgm.play();
          els.audioBtn.textContent = "♫";
        } else {
          els.bgm.pause();
          els.audioBtn.textContent = "♪";
        }
      } catch (error) {
        els.audioBtn.textContent = "♪";
      }
    });

    window.addEventListener("storage", (event) => {
      if (event.key !== STORAGE_KEY) return;
      state = loadState();
      render();
    });

    if (channel) {
      channel.onmessage = () => {
        state = loadState();
        render();
      };
    }

    setInterval(() => {
      const latest = loadState();
      if (latest.updatedAt !== state.updatedAt) {
        state = latest;
        render();
      }
    }, 1200);

    render();
  </script>
</body>
</html>
